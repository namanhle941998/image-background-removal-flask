<!DOCTYPE html>
<html>
  <head>
    <title>✂️ rmbg</title>
    <style>
      body {
        height: 100vh;
        display: flex;

        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .drop-zone {
        border: 2px dashed #ccc;
        padding: 20px;
        width: 80vw;
        height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .drop-zone.dragover {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div id="dropZone" class="drop-zone">
      <h1>rmbg</h1>
      <form
        id="uploadForm"
        action="/"
        method="post"
        enctype="multipart/form-data"
      >
        <input id="fileInput" type="file" name="file" />
        <input type="submit" value="rm" />
      </form>
    </div>

    <script>
      let dropZone = document.getElementById("dropZone");
      let fileInput = document.getElementById("fileInput");
      let uploadForm = document.getElementById("uploadForm");

      dropZone.addEventListener("click", function () {
        console.log("Drop zone clicked");
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        if (fileInput.files.length > 0) {
          uploadForm.submit();
        }
      });

      dropZone.addEventListener("dragover", function (e) {
        this.classList.add("dragover");
      });

      dropZone.addEventListener("dragleave", function (e) {
        this.classList.remove("dragover");
      });

      // Add this to your existing drop event handler
      dropZone.addEventListener("drop", async function (e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.remove("dragover");
        console.log("Dropped files:", e.dataTransfer.files);

        // Check if dragging from another tab (contains HTML)
        if (e.dataTransfer.types.includes("text/html")) {
          const html = e.dataTransfer.getData("text/html");
          const match = html.match(/src\s*=\s*"?([^"\s]+)"?\s*/);

          if (match && match[1]) {
            const imageUrl = match[1];

            try {
              // Fetch the image from URL
              const response = await fetch(imageUrl);
              const blob = await response.blob();

              // Create a File object from the blob
              const file = new File([blob], "dragged-image.jpg", {
                type: blob.type,
              });

              // Create a FileList-like object
              const dt = new DataTransfer();
              dt.items.add(file);
              fileInput.files = dt.files;

              // Submit the form
              uploadForm.submit();
            } catch (error) {
              console.error("Error fetching image:", error);
            }
          }
        } else if (e.dataTransfer.files.length > 0) {
          // Handle normal file drops
          fileInput.files = e.dataTransfer.files;
          uploadForm.submit();
        }
      });
    </script>
  </body>
</html>
